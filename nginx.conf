# Nginx configuration untuk email_temp
# Letakkan di: /etc/nginx/sites-available/email-temp

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aniyahapp.my.id www.aniyahapp.my.id jasacode.my.id www.jasacode.my.id;
    
    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - aniyahapp.my.id
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aniyahapp.my.id www.aniyahapp.my.id;

    # SSL Certificate (akan di-generate oleh certbot)
    ssl_certificate /etc/letsencrypt/live/aniyahapp.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aniyahapp.my.id/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy to Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

